<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandHub | Create Account</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="auth-shell">
    <section class="auth-panel-wrap">
        <div class="container">
            <div class="auth-layout register-layout">
                <div class="auth-copy reveal">
                    <p class="section-kicker">Create customer account</p>
                    <h1>Start your verified land journey.</h1>
                    <p>Public registration creates a customer account only. Admin and staff accounts are managed separately.</p>
                </div>

                <form class="auth-card reveal" th:action="@{/register}" th:object="${registerForm}" method="post" aria-labelledby="register-title" novalidate>
                    <h2 id="register-title">Create Account</h2>

                    <div class="admin-form-grid">
                        <div class="form-field">
                            <label for="firstName">First Name</label>
                            <input id="firstName" type="text" th:field="*{firstName}" autocomplete="given-name">
                            <p class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                        </div>

                        <div class="form-field">
                            <label for="lastName">Last Name</label>
                            <input id="lastName" type="text" th:field="*{lastName}" autocomplete="family-name">
                            <p class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                        </div>

                        <div class="form-field span-2">
                            <label for="email">Email</label>
                            <input id="email" type="email" th:field="*{email}" autocomplete="email">
                            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        </div>

                        <div class="form-field span-2">
                            <label for="phone">Phone</label>
                            <input id="phone" type="tel" th:field="*{phone}" autocomplete="tel">
                            <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                        </div>

                        <div class="form-field">
                            <label for="password">Password</label>
                            <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
                            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        </div>

                        <div class="form-field">
                            <label for="confirmPassword">Confirm Password</label>
                            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password">
                            <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                        </div>
                    </div>

                    <label class="auth-check terms-check" for="termsAccepted">
                        <input id="termsAccepted" type="checkbox" th:field="*{termsAccepted}">
                        <span>I agree to use LandHub responsibly and understand this creates a customer account.</span>
                    </label>
                    <p class="field-error" th:if="${#fields.hasErrors('termsAccepted')}" th:errors="*{termsAccepted}"></p>

                    <button class="btn btn-primary w-100" type="submit">
                        <i class="bi bi-person-plus" aria-hidden="true"></i>
                        Create Account
                    </button>

                    <p class="auth-switch">Already have an account? <a th:href="@{/login}">Login</a></p>
                </form>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
