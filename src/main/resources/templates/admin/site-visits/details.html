<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub Admin | Site Visit Details</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Site visit review</p><h1>Visit Request</h1><p th:text="${siteVisit.land.title + ' / ' + siteVisit.customer.email}">Context</p></div><a class="btn btn-outline-light" th:href="@{/admin/site-visits}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="row g-4"><div class="col-lg-8"><article class="admin-card reveal"><div class="admin-card-heading"><h2>Visit Details</h2><span class="status" th:classappend="${siteVisit.status.name().toLowerCase()}" th:text="${#strings.replace(siteVisit.status.name(), '_', ' ')}">PENDING</span></div><dl class="details-grid"><div><dt>Customer</dt><dd th:text="${siteVisit.customer.firstName + ' ' + siteVisit.customer.lastName}">Customer</dd></div><div><dt>Property</dt><dd th:text="${siteVisit.land.title}">Land</dd></div><div><dt>Date</dt><dd th:text="${siteVisit.preferredDate}">Date</dd></div><div><dt>Time</dt><dd th:text="${siteVisit.preferredTime}">Time</dd></div></dl><div class="verification-note" th:if="${siteVisit.note}"><h3>Customer Note</h3><p th:text="${siteVisit.note}">Note</p></div><div class="verification-note" th:if="${siteVisit.adminNote}"><h3>Admin Note</h3><p th:text="${siteVisit.adminNote}">Admin note</p></div></article></div><aside class="col-lg-4"><div class="action-panel reveal"><p class="section-kicker">Admin actions</p><h2>Manage Visit</h2><form class="review-form" th:action="@{/admin/site-visits/{id}/approve(id=${siteVisit.id})}" method="post"><label for="approveNote">Approval note</label><textarea id="approveNote" name="adminNote" rows="3"></textarea><button class="btn btn-primary" type="submit">Approve</button></form><form class="review-form" th:action="@{/admin/site-visits/{id}/reject(id=${siteVisit.id})}" method="post"><label for="rejectNote">Rejection note</label><textarea id="rejectNote" name="adminNote" rows="3" required></textarea><button class="btn btn-danger-soft" type="submit">Reject</button></form><form class="review-form" th:action="@{/admin/site-visits/{id}/reschedule(id=${siteVisit.id})}" method="post"><label for="newDate">New date</label><input id="newDate" name="preferredDate" type="date" required><label for="newTime">New time</label><input id="newTime" name="preferredTime" type="time" required><label for="rescheduleNote">Reschedule note</label><textarea id="rescheduleNote" name="adminNote" rows="3" required></textarea><button class="btn btn-outline-dark" type="submit">Reschedule</button></form><form th:action="@{/admin/site-visits/{id}/complete(id=${siteVisit.id})}" method="post"><button class="btn btn-card" type="submit">Mark Complete</button></form></div></aside></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
