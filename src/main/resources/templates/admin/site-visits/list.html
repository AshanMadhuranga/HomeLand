<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub Admin | Site Visits</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Operations</p><h1>Site Visit Management</h1><p>Approve, reject, reschedule, and complete customer visit requests.</p></div><a class="btn btn-outline-light" th:href="@{/admin/dashboard}">Dashboard</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="admin-card reveal"><div class="admin-card-heading"><h2>All Site Visits</h2><span th:text="${#lists.size(siteVisits)} + ' records'">0 records</span></div><div class="admin-table-wrap" th:if="${!#lists.isEmpty(siteVisits)}"><table class="admin-table"><thead><tr><th>Customer</th><th>Property</th><th>Preferred Slot</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="visit : ${siteVisits}"><td><strong th:text="${visit.customer.firstName + ' ' + visit.customer.lastName}">Customer</strong><span th:text="${visit.customer.email}">email</span></td><td th:text="${visit.land.title}">Land</td><td><span th:text="${visit.preferredDate}">Date</span> <span th:text="${visit.preferredTime}">Time</span></td><td><span class="status" th:classappend="${visit.status.name().toLowerCase()}" th:text="${#strings.replace(visit.status.name(), '_', ' ')}">PENDING</span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/site-visits/{id}(id=${visit.id})}">Manage</a></td></tr></tbody></table></div><div class="empty-state compact" th:if="${#lists.isEmpty(siteVisits)}"><i class="bi bi-calendar2-check"></i><h3>No site visits</h3><p>Customer requests will appear here.</p></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
