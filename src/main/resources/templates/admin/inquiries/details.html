<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub Admin | Inquiry Details</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Inquiry review</p><h1 th:text="${inquiry.subject}">Inquiry</h1><p th:text="${inquiry.land.title + ' / ' + inquiry.customer.email}">Context</p></div><a class="btn btn-outline-light" th:href="@{/admin/inquiries}">Back</a></div></div></section>
<section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="row g-4"><div class="col-lg-8"><article class="admin-card reveal"><div class="admin-card-heading"><h2>Customer Message</h2><span class="status" th:classappend="${inquiry.status.name().toLowerCase()}" th:text="${inquiry.status}">OPEN</span></div><dl class="details-grid"><div><dt>Customer</dt><dd th:text="${inquiry.customer.firstName + ' ' + inquiry.customer.lastName}">Customer</dd></div><div><dt>Email</dt><dd th:text="${inquiry.customer.email}">Email</dd></div><div><dt>Property</dt><dd th:text="${inquiry.land.title}">Land</dd></div><div><dt>Created</dt><dd th:text="${#temporals.format(inquiry.createdAt, 'MMM dd, yyyy HH:mm')}">date</dd></div></dl><div class="verification-note"><h3>Message</h3><p th:text="${inquiry.message}">Message</p></div><div class="verification-note" th:if="${inquiry.response}"><h3>Response</h3><p th:text="${inquiry.response}">Response</p></div></article></div><aside class="col-lg-4"><div class="action-panel reveal"><p class="section-kicker">Admin actions</p><h2>Respond</h2><form class="review-form" th:action="@{/admin/inquiries/{id}/respond(id=${inquiry.id})}" method="post"><label for="response">Response</label><textarea id="response" name="response" rows="6" maxlength="2000" required th:text="${inquiry.response}"></textarea><button class="btn btn-primary" type="submit">Send Response</button></form><form th:action="@{/admin/inquiries/{id}/resolve(id=${inquiry.id})}" method="post"><button class="btn btn-outline-dark" type="submit" th:disabled="${inquiry.status.name() == 'RESOLVED' || inquiry.status.name() == 'CANCELLED'}">Mark Resolved</button></form></div></aside></div></div></section></main>
<div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
