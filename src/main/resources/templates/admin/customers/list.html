<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Customer Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">CRM</p><h1>Customer Management</h1><p>View relationship summaries for customer accounts.</p></div><a class="btn btn-outline-light" th:href="@{/admin/dashboard}">Dashboard</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="admin-card reveal"><div class="admin-card-heading"><h2>Customers</h2><span th:text="${#lists.size(customers)} + ' records'">0 records</span></div><div class="admin-table-wrap" th:if="${!#lists.isEmpty(customers)}"><table class="admin-table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Bookings</th><th>Completed</th><th>Total Paid</th><th>Actions</th></tr></thead><tbody><tr th:each="customer : ${customers}" th:with="summary=${crmService.summary(customer)}"><td th:text="${customer.id}">1</td><td th:text="${customer.firstName + ' ' + customer.lastName}">Customer</td><td th:text="${customer.email}">email</td><td th:text="${customer.phone}">phone</td><td><span class="status" th:text="${customer.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span></td><td th:text="${summary.bookings}">0</td><td th:text="${summary.completedBookings}">0</td><td>LKR <span th:text="${summary.totalPaid}">0</span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/customers/{id}(id=${customer.id})}">CRM Profile</a></td></tr></tbody></table></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
