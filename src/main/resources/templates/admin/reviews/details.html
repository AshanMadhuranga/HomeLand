<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Review Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Review moderation</p><h1 th:text="${review.title}">Review</h1><p th:text="${review.land.title}">Land</p></div><a class="btn btn-outline-light" th:href="@{/admin/reviews}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="row g-4"><div class="col-lg-8"><article class="admin-card reveal"><div class="admin-card-heading"><h2>Review Details</h2><span class="status" th:classappend="${review.status.name().toLowerCase()}" th:text="${review.status}">PENDING</span></div><dl class="details-grid"><div><dt>Customer</dt><dd th:text="${review.customer.firstName + ' ' + review.customer.lastName}">Customer</dd></div><div><dt>Property</dt><dd th:text="${review.land.title}">Land</dd></div><div><dt>Booking</dt><dd th:text="${review.booking.id}">1</dd></div><div><dt>Rating</dt><dd th:text="${review.rating + ' / 5'}">5</dd></div></dl><div class="verification-note"><h3>Comment</h3><p th:text="${review.comment}">Comment</p></div><div class="verification-note danger" th:if="${review.moderationReason}"><h3>Reason</h3><p th:text="${review.moderationReason}">Reason</p></div></article></div><aside class="col-lg-4"><div class="action-panel reveal"><p class="section-kicker">Actions</p><h2>Moderate</h2><form class="review-form" th:action="@{/admin/reviews/{id}/approve(id=${review.id})}" method="post"><button class="btn btn-primary w-100" type="submit">Approve</button></form><form class="review-form" th:action="@{/admin/reviews/{id}/reject(id=${review.id})}" method="post"><label>Reason</label><textarea name="reason" rows="3"></textarea><button class="btn btn-danger-soft w-100" type="submit">Reject</button></form><form class="review-form" th:action="@{/admin/reviews/{id}/hide(id=${review.id})}" method="post"><label>Hide reason</label><textarea name="reason" rows="3"></textarea><button class="btn btn-outline-dark w-100" type="submit">Hide</button></form></div></aside></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
