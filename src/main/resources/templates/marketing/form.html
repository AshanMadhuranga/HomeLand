<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Promotion Form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Campaign editor</p><h1 th:text="${promotion.id == null ? 'New Promotion' : 'Edit Promotion'}">New Promotion</h1><p>Set a clear offer for a verified public property.</p></div><a class="btn btn-outline-light" th:href="@{/marketing}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="admin-form-card reveal" th:object="${promotion}" th:action="${promotion.id == null ? '/marketing' : '/marketing/' + promotion.id + '/update'}" method="post"><div class="admin-form-grid"><div class="form-field span-2"><label for="title">Campaign Title</label><input id="title" name="title" maxlength="180" required th:value="${promotion.title}"></div><div class="form-field"><label for="landId">Land Listing</label><select id="landId" name="landId" required><option value="">Select verified land</option><option th:each="land : ${lands}" th:value="${land.id}" th:selected="${promotion.land != null && promotion.land.id == land.id}" th:text="${land.title + ' - ' + land.location + ' (' + land.status + ')'}">Property</option></select></div><div class="form-field"><label for="promotionType">Promotion Type</label><select id="promotionType" name="promotionType" required><option th:each="type : ${promotionTypes}" th:value="${type}" th:selected="${promotion.promotionType == type}" th:text="${#strings.replace(type.name(), '_', ' ')}">SPECIAL OFFER</option></select></div><div class="form-field"><label for="status">Campaign Status</label><select id="status" name="status"><option th:each="status : ${promotionStatuses}" th:value="${status}" th:selected="${promotion.status == status}" th:text="${status}">DRAFT</option></select></div><div class="form-field"><label for="startDate">Start Date</label><input id="startDate" name="startDate" type="date" required th:value="${promotion.startDate}"></div><div class="form-field"><label for="endDate">End Date</label><input id="endDate" name="endDate" type="date" required th:value="${promotion.endDate}"></div><div class="form-field"><label for="discountPercentage">Discount Percentage</label><input id="discountPercentage" name="discountPercentage" type="number" min="0.01" max="100" step="0.01" th:value="${promotion.discountPercentage}"></div><div class="form-field"><label for="discountAmount">Fixed Discount Amount</label><input id="discountAmount" name="discountAmount" type="number" min="0.01" step="0.01" th:value="${promotion.discountAmount}"></div><div class="form-field span-2"><label for="promotionalText">Promotional Text</label><textarea id="promotionalText" name="promotionalText" rows="3" maxlength="500" th:text="${promotion.promotionalText}"></textarea></div><div class="form-field span-2"><label for="description">Description</label><textarea id="description" name="description" rows="5" maxlength="2000" th:text="${promotion.description}"></textarea></div><div class="form-field span-2"><label for="bannerImageUrl">Banner Image URL <span class="text-muted">(optional)</span></label><input id="bannerImageUrl" name="bannerImageUrl" maxlength="500" th:value="${promotion.bannerImageUrl}"></div><div class="form-field span-2"><label class="verified-check"><input name="featured" type="checkbox" value="true" th:checked="${promotion.featured}"><span>Feature this campaign for its linked land</span></label></div></div><p class="text-muted mt-3">Use either a percentage discount or a fixed amount. The original land price is never changed.</p><div class="form-actions"><button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save Promotion</button><a class="btn btn-outline-dark" th:href="@{/marketing}">Cancel</a></div></form></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/main.js}"></script></body></html>
