<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Site Visit Details</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Site visit record</p><h1>Visit Request</h1><p th:text="${siteVisit.land.title + ' in ' + siteVisit.land.location}">Land</p></div><a class="btn btn-outline-light" th:href="@{/customer/site-visits}">Back</a></div></div></section>
<section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="row g-4"><div class="col-lg-8"><article class="admin-card reveal"><div class="admin-card-heading"><h2>Visit Details</h2><span class="status" th:classappend="${siteVisit.status.name().toLowerCase()}" th:text="${#strings.replace(siteVisit.status.name(), '_', ' ')}">PENDING</span></div><dl class="details-grid"><div><dt>Preferred Date</dt><dd th:text="${siteVisit.preferredDate}">date</dd></div><div><dt>Preferred Time</dt><dd th:text="${siteVisit.preferredTime}">time</dd></div><div><dt>Property</dt><dd th:text="${siteVisit.land.title}">Land</dd></div><div><dt>Location</dt><dd th:text="${siteVisit.land.location}">Location</dd></div></dl><div class="verification-note" th:if="${siteVisit.note}"><h3>Your Note</h3><p th:text="${siteVisit.note}">Note</p></div><div class="verification-note" th:if="${siteVisit.adminNote}"><h3>LandHub Note</h3><p th:text="${siteVisit.adminNote}">Admin note</p></div></article></div><aside class="col-lg-4"><div class="action-panel reveal"><p class="section-kicker">Actions</p><h2>Status</h2><form th:action="@{/customer/site-visits/{id}/cancel(id=${siteVisit.id})}" method="post"><button class="btn btn-danger-soft" type="submit" th:disabled="${!siteVisit.cancellableByCustomer}">Cancel Request</button></form></div></aside></div></div></section></main>
<div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
