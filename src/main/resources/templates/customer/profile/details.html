<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | My Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Customer profile</p><h1>My Profile</h1><p>Manage your LandHub contact details.</p></div><a class="btn btn-primary" th:href="@{/customer/profile/edit}">Edit Profile</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><article class="admin-card reveal"><div class="admin-card-heading"><h2>Profile Details</h2><span class="status" th:text="${customer.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span></div><dl class="details-grid"><div><dt>Full Name</dt><dd th:text="${customer.firstName + ' ' + customer.lastName}">Customer</dd></div><div><dt>Email</dt><dd th:text="${customer.email}">email</dd></div><div><dt>Phone</dt><dd th:text="${customer.phone}">phone</dd></div><div><dt>Joined</dt><dd th:text="${#temporals.format(customer.createdAt, 'MMM dd, yyyy')}">date</dd></div><div><dt>Role</dt><dd th:text="${customer.role}">CUSTOMER</dd></div><div><dt>Status</dt><dd th:text="${customer.enabled ? 'Enabled' : 'Disabled'}">Enabled</dd></div></dl></article><div class="dashboard-grid reveal mt-4"><article class="dashboard-stat"><i class="bi bi-chat-dots"></i><span>Inquiries</span><strong th:text="${inquiryCount}">0</strong></article><article class="dashboard-stat"><i class="bi bi-bookmark-check"></i><span>Bookings</span><strong th:text="${bookingCount}">0</strong></article><article class="dashboard-stat"><i class="bi bi-credit-card"></i><span>Payments</span><strong th:text="${paymentCount}">0</strong></article><article class="dashboard-stat"><i class="bi bi-star"></i><span>Reviews</span><strong th:text="${reviewCount}">0</strong></article><article class="dashboard-stat"><i class="bi bi-envelope-heart"></i><span>Feedback</span><strong th:text="${feedbackCount}">0</strong></article></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
