<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Edit Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Customer profile</p><h1>Edit Profile</h1><p>Email, role, and account status are protected.</p></div><a class="btn btn-outline-light" th:href="@{/customer/profile}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="admin-form-card reveal" th:action="@{/customer/profile/update}" method="post"><section class="form-section"><h2>Contact Details</h2><div class="admin-form-grid"><div class="form-field"><label for="firstName">First Name</label><input id="firstName" name="firstName" th:value="${customer.firstName}" required maxlength="80"></div><div class="form-field"><label for="lastName">Last Name</label><input id="lastName" name="lastName" th:value="${customer.lastName}" required maxlength="80"></div><div class="form-field"><label for="phone">Phone</label><input id="phone" name="phone" th:value="${customer.phone}" required maxlength="30"></div><div class="form-field"><label>Email</label><input th:value="${customer.email}" readonly></div></div></section><div class="form-actions"><button class="btn btn-primary" type="submit">Save Changes</button><a class="btn btn-outline-dark" th:href="@{/customer/profile}">Cancel</a></div></form></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
