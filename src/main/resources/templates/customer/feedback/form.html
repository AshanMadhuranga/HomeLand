<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | New Feedback</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Customer feedback</p><h1>Submit Feedback</h1><p>Tell LandHub what needs attention.</p></div><a class="btn btn-outline-light" th:href="@{/customer/feedback}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="admin-form-card reveal" th:action="@{/customer/feedback}" method="post"><section class="form-section"><h2>Feedback Details</h2><div class="admin-form-grid"><div class="form-field"><label for="type">Type</label><select id="type" name="type" required><option th:each="item : ${types}" th:value="${item}" th:selected="${item == type}" th:text="${#strings.replace(item.name(), '_', ' ')}">GENERAL</option></select></div><div class="form-field"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="160" th:value="${subject}" required></div><div class="form-field span-2"><label for="message">Message</label><textarea id="message" name="message" rows="7" maxlength="2500" required th:text="${message}"></textarea></div></div></section><div class="form-actions"><button class="btn btn-primary" type="submit">Submit Feedback</button><a class="btn btn-outline-dark" th:href="@{/customer/feedback}">Cancel</a></div></form></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
