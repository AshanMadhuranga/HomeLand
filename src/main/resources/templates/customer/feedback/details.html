<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Feedback Details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Feedback record</p><h1 th:text="${feedback.subject}">Feedback</h1><p th:text="${feedback.type}">GENERAL</p></div><a class="btn btn-outline-light" th:href="@{/customer/feedback}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><article class="admin-card reveal"><div class="admin-card-heading"><h2>Feedback Details</h2><span class="status" th:classappend="${feedback.status.name().toLowerCase()}" th:text="${feedback.status}">OPEN</span></div><dl class="details-grid"><div><dt>Type</dt><dd th:text="${feedback.type}">GENERAL</dd></div><div><dt>Created</dt><dd th:text="${#temporals.format(feedback.createdAt, 'MMM dd, yyyy HH:mm')}">date</dd></div></dl><div class="verification-note"><h3>Your Message</h3><p th:text="${feedback.message}">Message</p></div><div class="verification-note" th:if="${feedback.adminResponse}"><h3>LandHub Response</h3><p th:text="${feedback.adminResponse}">Response</p></div><div class="form-actions"><form th:if="${feedback.status.name() == 'OPEN'}" th:action="@{/customer/feedback/{id}/cancel(id=${feedback.id})}" method="post"><button class="btn btn-danger-soft" type="submit">Cancel Feedback</button></form></div></article></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
