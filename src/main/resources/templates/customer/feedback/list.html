<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | My Feedback</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Customer workspace</p><h1>My Feedback</h1><p>Send and track support feedback.</p></div><a class="btn btn-primary" th:href="@{/customer/feedback/new}">New Feedback</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="admin-card reveal"><div class="admin-card-heading"><h2>Feedback History</h2><span th:text="${#lists.size(feedbackItems)} + ' records'">0 records</span></div><div class="empty-state compact" th:if="${#lists.isEmpty(feedbackItems)}"><i class="bi bi-envelope-heart"></i><h3>No feedback yet</h3><p>Your submitted feedback will appear here.</p></div><div class="admin-table-wrap" th:if="${!#lists.isEmpty(feedbackItems)}"><table class="admin-table"><thead><tr><th>Subject</th><th>Type</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody><tr th:each="feedback : ${feedbackItems}"><td th:text="${feedback.subject}">Subject</td><td th:text="${feedback.type}">GENERAL</td><td><span class="status" th:classappend="${feedback.status.name().toLowerCase()}" th:text="${feedback.status}">OPEN</span></td><td th:text="${#temporals.format(feedback.createdAt, 'MMM dd, yyyy')}">date</td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/customer/feedback/{id}(id=${feedback.id})}">View</a></td></tr></tbody></table></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
