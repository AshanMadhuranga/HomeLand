<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Payment Receipt</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"><style>@media print{.no-print{display:none!important}body{background:#fff}.receipt-card{box-shadow:none!important;border:1px solid #ddd}}</style></head>
<body><main class="admin-shell"><section class="admin-content section-padding"><div class="container"><article class="admin-card receipt-card reveal"><div class="admin-card-heading"><div><p class="section-kicker">LANDHUB</p><h1>PAYMENT RECEIPT</h1></div><button class="btn btn-primary no-print" onclick="window.print()">Print Receipt</button></div><dl class="details-grid"><div><dt>Receipt ID</dt><dd th:text="${payment.id}">1</dd></div><div><dt>Transaction Reference</dt><dd th:text="${payment.transactionReference}">LH</dd></div><div><dt>Customer Name</dt><dd th:text="${payment.customer.firstName + ' ' + payment.customer.lastName}">Customer</dd></div><div><dt>Customer Email</dt><dd th:text="${payment.customer.email}">email</dd></div><div><dt>Property</dt><dd th:text="${payment.booking.land.title}">Property</dd></div><div><dt>Booking ID</dt><dd th:text="${payment.booking.id}">1</dd></div><div><dt>Payment Type</dt><dd th:text="${#strings.replace(payment.paymentType.name(), '_', ' ')}">DEPOSIT</dd></div><div><dt>Payment Method</dt><dd th:text="${#strings.replace(payment.paymentMethod.name(), '_', ' ')}">CASH</dd></div><div><dt>Amount</dt><dd>LKR <span th:text="${payment.amount}">0</span></dd></div><div><dt>Paid Date</dt><dd th:text="${#temporals.format(payment.paidAt, 'MMM dd, yyyy HH:mm')}">date</dd></div><div><dt>Payment Status</dt><dd th:text="${payment.status}">PAID</dd></div></dl><div class="form-actions no-print"><a class="btn btn-outline-dark" th:href="@{/customer/payments/{id}(id=${payment.id})}">Back to Payment</a></div></article></div></section></main></body></html>
