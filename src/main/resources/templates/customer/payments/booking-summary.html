<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Booking Payments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Booking payments</p><h1 th:text="${summary.booking.land.title}">Property</h1><p>Review balance and payment history for this booking.</p></div><a class="btn btn-outline-light" th:href="@{/customer/bookings/{id}(id=${summary.booking.id})}">Back to Booking</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="admin-card reveal"><div class="admin-card-heading"><h2>Balance</h2><a class="btn btn-primary" th:if="${summary.booking.status.name() == 'APPROVED' && summary.remainingBalance.compareTo(T(java.math.BigDecimal).ZERO) > 0}" th:href="@{/customer/payments/new/{id}(id=${summary.booking.id})}">Proceed to Payment</a></div><dl class="details-grid"><div><dt>Booking Price</dt><dd>LKR <span th:text="${summary.bookingPrice}">0</span></dd></div><div><dt>Total Paid</dt><dd>LKR <span th:text="${summary.totalPaid}">0</span></dd></div><div><dt>Remaining Balance</dt><dd>LKR <span th:text="${summary.remainingBalance}">0</span></dd></div></dl></div><div class="admin-card reveal mt-4"><div class="admin-card-heading"><h2>Payments</h2><span th:text="${#lists.size(payments)} + ' records'">0 records</span></div><div class="admin-table-wrap" th:if="${!#lists.isEmpty(payments)}"><table class="admin-table"><thead><tr><th>Reference</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="payment : ${payments}"><td th:text="${payment.transactionReference}">LH</td><td th:text="${payment.paymentType}">DEPOSIT</td><td th:text="${payment.paymentMethod}">CASH</td><td>LKR <span th:text="${payment.amount}">0</span></td><td><span class="status" th:classappend="${payment.status.name().toLowerCase()}" th:text="${payment.status}">PENDING</span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/customer/payments/{id}(id=${payment.id})}">View</a></td></tr></tbody></table></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
