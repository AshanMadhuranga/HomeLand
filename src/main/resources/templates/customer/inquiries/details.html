<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Inquiry Details</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="admin-shell">
    <section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Inquiry record</p><h1 th:text="${inquiry.subject}">Inquiry</h1><p th:text="${inquiry.land.title + ' in ' + inquiry.land.location}">Land</p></div><a class="btn btn-outline-light" th:href="@{/customer/inquiries}">Back</a></div></div></section>
    <section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="row g-4"><div class="col-lg-8"><article class="admin-card reveal"><div class="admin-card-heading"><h2>Message</h2><span class="status" th:classappend="${inquiry.status.name().toLowerCase()}" th:text="${inquiry.status}">OPEN</span></div><p th:text="${inquiry.message}">Message</p><div class="verification-note" th:if="${inquiry.response}"><h3>LandHub Response</h3><p th:text="${inquiry.response}">Response</p></div></article></div>
        <aside class="col-lg-4"><div class="action-panel reveal"><p class="section-kicker">Actions</p><h2>Inquiry Status</h2><p>Created <span th:text="${#temporals.format(inquiry.createdAt, 'MMM dd, yyyy HH:mm')}">date</span></p><form th:action="@{/customer/inquiries/{id}/cancel(id=${inquiry.id})}" method="post"><button class="btn btn-danger-soft" type="submit" th:disabled="${inquiry.status.name() != 'OPEN'}">Cancel Inquiry</button></form></div></aside></div>
    </div></section>
</main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
