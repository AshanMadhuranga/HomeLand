<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandHub | My Inquiries</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="admin-shell">
    <section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Customer workspace</p><h1>My Inquiries</h1><p>Track messages sent about LandHub properties.</p></div><a class="btn btn-primary" th:href="@{/lands}">Browse Lands</a></div></div></section>
    <section class="admin-content section-padding"><div class="container">
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="admin-card reveal">
            <div class="admin-card-heading"><h2>Inquiry History</h2><span th:text="${#lists.size(inquiries)} + ' records'">0 records</span></div>
            <div class="empty-state compact" th:if="${#lists.isEmpty(inquiries)}"><i class="bi bi-chat-dots"></i><h3>No inquiries yet</h3><p>Open a land detail page and send your first inquiry.</p></div>
            <div class="admin-table-wrap" th:if="${!#lists.isEmpty(inquiries)}"><table class="admin-table"><thead><tr><th>Property</th><th>Subject</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>
            <tr th:each="inquiry : ${inquiries}"><td><strong th:text="${inquiry.land.title}">Land</strong><span th:text="${inquiry.land.location}">Location</span></td><td th:text="${inquiry.subject}">Subject</td><td><span class="status" th:classappend="${inquiry.status.name().toLowerCase()}" th:text="${inquiry.status}">OPEN</span></td><td th:text="${#temporals.format(inquiry.createdAt, 'MMM dd, yyyy HH:mm')}">date</td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/customer/inquiries/{id}(id=${inquiry.id})}">View</a></td></tr>
            </tbody></table></div>
        </div>
    </div></section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script>
</body>
</html>
