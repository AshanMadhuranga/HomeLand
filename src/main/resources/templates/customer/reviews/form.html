<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | Review</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Completed purchase</p><h1 th:text="${review == null ? 'Leave a Review' : 'Edit Review'}">Review</h1><p th:text="${booking.land.title}">Land</p></div><a class="btn btn-outline-light" th:href="@{/customer/reviews}">Back</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><form class="admin-form-card reveal" th:action="${review == null} ? @{/customer/reviews} : @{/customer/reviews/{id}/update(id=${review.id})}" method="post"><input type="hidden" name="bookingId" th:value="${booking.id}"><section class="form-section"><h2>Review Details</h2><div class="admin-form-grid"><div class="form-field"><label for="rating">Rating</label><input id="rating" name="rating" type="number" min="1" max="5" th:value="${review != null ? review.rating : rating}" required></div><div class="form-field"><label for="title">Title</label><input id="title" name="title" th:value="${review != null ? review.title : title}" maxlength="160" required></div><div class="form-field span-2"><label for="comment">Comment</label><textarea id="comment" name="comment" rows="6" maxlength="2000" required th:text="${review != null ? review.comment : comment}"></textarea></div></div></section><div class="form-actions"><button class="btn btn-primary" type="submit">Submit Review</button><a class="btn btn-outline-dark" th:href="@{/customer/bookings/{id}(id=${booking.id})}">Cancel</a></div></form></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
