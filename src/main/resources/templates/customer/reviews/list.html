<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LandHub | My Reviews</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content" class="admin-shell"><section class="admin-header"><div class="container"><div class="admin-header-row reveal"><div><p class="section-kicker">Customer workspace</p><h1>My Reviews</h1><p>Reviews from completed purchases.</p></div><a class="btn btn-outline-light" th:href="@{/customer/bookings}">My Bookings</a></div></div></section><section class="admin-content section-padding"><div class="container"><div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="admin-card reveal"><div class="admin-card-heading"><h2>Review History</h2><span th:text="${#lists.size(reviews)} + ' records'">0 records</span></div><div class="empty-state compact" th:if="${#lists.isEmpty(reviews)}"><i class="bi bi-star"></i><h3>No reviews yet</h3><p>Completed bookings can be reviewed from booking details.</p></div><div class="admin-table-wrap" th:if="${!#lists.isEmpty(reviews)}"><table class="admin-table"><thead><tr><th>Property</th><th>Rating</th><th>Title</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody><tr th:each="review : ${reviews}"><td th:text="${review.land.title}">Land</td><td th:text="${review.rating + ' / 5'}">5</td><td th:text="${review.title}">Title</td><td><span class="status" th:classappend="${review.status.name().toLowerCase()}" th:text="${review.status}">PENDING</span></td><td th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}">date</td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/customer/reviews/{id}(id=${review.id})}">View</a></td></tr></tbody></table></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/main.js}"></script></body></html>
