<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${'LandHub | ' + promotion.title}">LandHub | Offer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link th:href="@{/css/style.css}" rel="stylesheet"></head>
<body><a class="skip-link" href="#main-content">Skip to content</a><div th:replace="~{fragments/navbar :: navbar}"></div><main id="main-content"><section class="detail-hero"><div class="container"><nav class="breadcrumb-wrap reveal"><a th:href="@{/}">Home</a><i class="bi bi-chevron-right"></i><a th:href="@{/promotions}">Promotions</a><i class="bi bi-chevron-right"></i><span th:text="${promotion.title}">Offer</span></nav></div></section><section class="detail-section section-padding"><div class="container"><div class="row g-5"><div class="col-lg-7"><div class="property-gallery reveal"><img class="gallery-main" th:src="${promotion.bannerImageUrl != null ? promotion.bannerImageUrl : promotion.land.coverImageUrl}" th:alt="${promotion.land.title}"></div></div><div class="col-lg-5"><article class="detail-card reveal"><p class="section-kicker">Active promotion</p><h1 th:text="${promotion.title}">Launch Offer</h1><h2 th:text="${promotion.land.title}">Featured Land</h2><p class="detail-location"><i class="bi bi-geo-alt"></i> <span th:text="${promotion.land.location + ', ' + promotion.land.district}">Location</span></p><div class="detail-facts"><div><span>Original Price</span><strong class="text-decoration-line-through">LKR <span th:text="${promotion.land.price}">0</span></strong></div><div><span>Discount</span><strong th:text="${promotion.discountPercentage != null ? promotion.discountPercentage + '%' : (promotion.discountAmount != null ? 'LKR ' + promotion.discountAmount : 'Offer')}">10%</strong></div><div><span>Promotional Price</span><strong>LKR <span th:text="${promotion.promotionalPrice}">0</span></strong></div><div><span>Ends</span><strong th:text="${promotion.endDate}">2026-12-31</strong></div></div><p th:text="${promotion.promotionalText != null ? promotion.promotionalText : promotion.description}">Offer description</p><a class="btn btn-primary w-100" th:href="@{/lands/{id}(id=${promotion.land.id})}"><i class="bi bi-map"></i> View Property</a></article></div></div></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/main.js}"></script></body></html>
