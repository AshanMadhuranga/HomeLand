<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'LandHub Admin | Verify ' + land.title}">LandHub Admin | New Verification</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="admin-shell">
    <section class="admin-header verification-header">
        <div class="container">
            <div class="admin-header-row reveal">
                <div>
                    <p class="section-kicker">Verification intake</p>
                    <h1>New Verification Request</h1>
                    <p th:text="${land.title + ' in ' + land.location + ', ' + land.district}">Prime Residential Plot in Malabe, Colombo</p>
                </div>
                <a class="btn btn-outline-light" th:href="@{/admin/lands/{id}(id=${land.id})}">Back to Land</a>
            </div>
        </div>
    </section>

    <section class="admin-content section-padding">
        <div class="container">
            <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form class="admin-form-card reveal" th:action="@{/verification}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="landId" th:value="${land.id}">

                <section class="form-section" aria-labelledby="request-details-heading">
                    <h2 id="request-details-heading">Request Details</h2>
                    <div class="admin-form-grid">
                        <div class="form-field">
                            <label for="submittedByName">Submitted by</label>
                            <input id="submittedByName" name="submittedByName" type="text" maxlength="160"
                                   th:value="${submittedByName}" placeholder="Admin, staff member, or owner name" required>
                        </div>

                        <div class="form-field">
                            <label for="documentType">Initial document type</label>
                            <select id="documentType" name="documentType">
                                <option th:each="type : ${documentTypes}" th:value="${type}" th:text="${#strings.replace(type.name(), '_', ' ')}"></option>
                            </select>
                        </div>

                        <div class="form-field span-2">
                            <label for="notes">Review notes</label>
                            <textarea id="notes" name="notes" rows="5" maxlength="2000" th:text="${notes}" placeholder="Record the submitted documents, land context, or verification focus."></textarea>
                        </div>
                    </div>
                </section>

                <section class="form-section" aria-labelledby="document-upload-heading">
                    <h2 id="document-upload-heading">Documents</h2>
                    <div class="upload-panel">
                        <i class="bi bi-file-earmark-arrow-up" aria-hidden="true"></i>
                        <div>
                            <label for="documents">Upload supporting files</label>
                            <input id="documents" name="documents" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp">
                            <p>PDF, JPG, JPEG, PNG, and WEBP only. Maximum 10MB per file.</p>
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-shield-plus" aria-hidden="true"></i>
                        Create Verification Request
                    </button>
                    <a class="btn btn-outline-dark" th:href="@{/admin/lands/{id}(id=${land.id})}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
